name: Update public market intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: westcon-intelligence-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh deep public intelligence for all FY27 vendors
        env:
          RESEARCH_WORKERS: '6'
          RESEARCH_HORIZON_DAYS: '365'
        run: python scripts/research_intelligence.py
      - name: Validate refreshed intelligence
        run: python scripts/quality_gate.py
      - name: Commit only when public intelligence changed
        run: |
          git config user.name "westcon-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live-intelligence.json data/live-intelligence.js
          if git diff --cached --quiet; then
            echo "No intelligence changes"
          else
            git commit -m "chore: refresh market intelligence"
            git push
          fi
